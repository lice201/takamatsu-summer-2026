<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>다카마쓰 3박 4일 · 고베 Day 3 버전</title>
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f4f0e8}
    #site{position:fixed;inset:0;width:100%;height:100%;border:0;background:#f4f0e8}
    #loading{position:fixed;inset:0;display:grid;place-items:center;z-index:2;font:600 14px/1.5 system-ui,-apple-system,"Noto Sans KR",sans-serif;letter-spacing:.08em;color:#27354a;background:#f4f0e8}
  </style>
</head>
<body>
  <div id="loading">KOBE VERSION · LOADING</div>
  <iframe id="site" src="../" title="다카마쓰 3박 4일 고베 버전"></iframe>
  <script>
  (() => {
    const frame = document.getElementById('site');
    const loading = document.getElementById('loading');

    const text = (el, value) => { if (el) el.textContent = value; };
    const html = (el, value) => { if (el) el.innerHTML = value; };

    function replaceText(root, from, to) {
      if (!root) return;
      const walker = root.ownerDocument.createTreeWalker(root, NodeFilter.SHOW_TEXT);
      const nodes = [];
      while (walker.nextNode()) nodes.push(walker.currentNode);
      for (const node of nodes) {
        if (node.nodeValue && node.nodeValue.includes(from)) node.nodeValue = node.nodeValue.replaceAll(from, to);
      }
    }

    function applyKobeVariant() {
      const doc = frame.contentDocument;
      if (!doc || !doc.body) return;
      doc.title = '다카마쓰 3박 4일 · 고베 Day 3 버전';

      // Variant marker
      if (!doc.getElementById('kobe-variant-badge')) {
        const badge = doc.createElement('div');
        badge.id = 'kobe-variant-badge';
        badge.textContent = 'KOBE · DAY 3 VARIANT';
        badge.style.cssText = 'position:fixed;right:14px;bottom:14px;z-index:99999;padding:9px 12px;border-radius:999px;background:rgba(23,39,64,.92);color:#fff;font:700 11px/1 system-ui,-apple-system,sans-serif;letter-spacing:.09em;box-shadow:0 6px 22px rgba(0,0,0,.18);pointer-events:none';
        doc.body.appendChild(badge);
      }

      // Navigation
      const day3Nav = doc.querySelector('nav a[href="#day3"]');
      if (day3Nav) { day3Nav.textContent = '고베'; day3Nav.setAttribute('href', '#day-8.26'); }

      // Overview / weather copy
      const globalReplacements = [
        ['정원·평지 관광과 구라시키 당일치기까지 충분히 즐길 수 있어요.', '정원·평지 관광과 고베 당일치기까지 충분히 즐길 수 있어요.'],
        ['구라시키행 열차 운행 공지를 출발 전 점검', '고베행 마린라이너·산요 신칸센 운행 공지를 출발 전 점검'],
        ['8월 26일 구라시키 당일치기도 폭염 기준으로 배치', '8월 26일 고베 당일치기도 폭염 기준으로 배치'],
        ['오전 11시 전 미관지구 야외 산책 · 12–15시는 냉방이 되는 열차·오하라미술관 실내 관람 · 이동 중 물을 미리 보충하세요.', '오전에는 기타노를 짧게 보고 · 12–15시는 난킨마치·모토마치·산노미야 실내 비중을 높이고 · 해가 기울면 메리켄파크·하버랜드로 이동하세요.'],
        ['3일차 구라시키는 철도로 다녀와 페리권을 쓰지 않습니다.', '3일차 고베는 철도로 다녀오며 간사이 와이드 패스를 사용합니다. 페리권은 쓰지 않습니다.'],
        ['다카마쓰·구라시키의 구글 지도 검색이 열려요.', '다카마쓰·고베의 구글 지도 검색이 열려요.'],
        ['여름 다카마쓰(카가와)·구라시키(오카야마) 여행에 맞춘 준비물이에요.', '여름 다카마쓰(카가와)·고베(효고) 여행에 맞춘 준비물이에요.'],
        ['다카마쓰(카가와)·구라시키(오카야마)는', '다카마쓰(카가와)·고베(효고)는'],
      ];
      for (const [a,b] of globalReplacements) replaceText(doc.body, a, b);

      // Day 3 block
      const day = doc.getElementById('day-8.26');
      if (day) {
        text(day.querySelector('.day-block-title p'), '고베 · 기타노 · 난킨마치 · 하버랜드');
        text(day.querySelector('.day-block-title h3'), '항구도시 고베를 꽉 채우는 하루');

        const rows = [
          ['06:45', '다카마쓰역 출발', '마린라이너 → 오카야마 환승 → 산요 신칸센 · 간사이 와이드 패스 사용'],
          ['08:35', '신고베역 도착', '환승 포함 약 1시간 40~55분 · 도착 후 기타노부터 시작'],
          ['08:50', '기타노 이진칸 거리', '이국적인 언덕 거리 · 폭염을 피해 오전 1~1.5시간만 집중'],
          ['10:45', '산노미야·모토마치 이동', '센터가이·상점가로 내려오며 냉방 구간 확보'],
          ['11:30', '난킨마치 점심', '부타만·중화요리 또는 고베규 · 웨이팅 길면 모토마치로 이동'],
          ['12:45', '모토마치·다이마루 실내', '12–15시 한낮은 백화점·상점가·카페 중심으로 쉬어가기'],
          ['15:30', '메리켄파크 → 하버랜드', 'BE KOBE·포트타워·MOSAIC · 해가 기울수록 야외 비중 확대'],
          ['19:20', '고베 출발', '신고베 → 오카야마 → 다카마쓰 · 마지막 연결 열차보다 충분히 앞서 출발'],
          ['21:10', '다카마쓰 복귀', '숙소 귀환 · 실제 열차 시각은 전날 JR 공식/지도 앱에서 재확인'],
        ];
        const timeline = day.querySelector('.timeline');
        if (timeline) {
          timeline.innerHTML = rows.map(r => `<div class="timeline-item"><time>${r[0]}</time><div><strong>${r[1]}</strong><p>${r[2]}</p></div></div>`).join('');
        }

        const photos = [...day.querySelectorAll('.day-photo')];
        const photoData = [
          {
            src:'https://commons.wikimedia.org/wiki/Special:Redirect/file/Kitano%20Street%20Kobe01s5s4110.jpg?width=1400',
            alt:'고베 기타노 이진칸 거리', caption:'기타노 이진칸 거리',
            href:'https://www.google.com/maps/search/?api=1&query=Kitano+Ijinkan+Kobe'
          },
          {
            src:'https://commons.wikimedia.org/wiki/Special:Redirect/file/Kobe%20Nankinmachi.jpg?width=1400',
            alt:'고베 난킨마치 차이나타운', caption:'난킨마치 · 모토마치',
            href:'https://www.google.com/maps/search/?api=1&query=Nankinmachi+Kobe'
          },
          {
            src:'https://commons.wikimedia.org/wiki/Special:Redirect/file/Kobe-meriken-park.jpg?width=1400',
            alt:'고베 메리켄파크와 포트타워', caption:'메리켄파크 · 하버랜드',
            href:'https://www.google.com/maps/search/?api=1&query=Meriken+Park+Kobe'
          }
        ];
        photos.slice(0,3).forEach((a,i) => {
          const d = photoData[i]; if (!d) return;
          a.href = d.href; a.setAttribute('aria-label', `${d.caption} 지도에서 보기`);
          const img = a.querySelector('img'); if (img) { img.src = d.src; img.alt = d.alt; }
          const span = a.querySelector('span'); if (span) span.innerHTML = `${d.caption}<b>지도 ↗</b>`;
        });

        text(day.querySelector('.verify-badge'), '고베 확정안 · 간사이 와이드 패스 + 열차 시각 재확인');

        const cards = [...day.querySelectorAll('.day3-cards article')];
        const cardData = [
          {
            tag:'오전 야외', name:'기타노 이진칸 거리',
            desc:'신고베역과 가까운 고베의 대표 이국거리. 언덕과 야외 구간이 있어 폭염 전 오전에 짧고 굵게 보고, 체력이 떨어지기 전에 산노미야 쪽으로 내려옵니다.',
            facts:[['접근','신고베역에서 도보·택시·버스 조합'],['전략','08:50~10:20 집중 · 언덕 무리 금지']],
            href:'https://www.feel-kobe.jp/en/areaguide/#area4', label:'VISIT KOBE · 기타노'
          },
          {
            tag:'점심 + 실내', name:'난킨마치 · 모토마치',
            desc:'일본 3대 차이나타운 중 하나인 난킨마치에서 점심을 먹고, 바로 옆 모토마치 상점가·다이마루로 이어서 한낮 냉방 시간을 확보합니다.',
            facts:[['접근','JR/한신 모토마치역 인근'],['폭염','12~15시 상점가·백화점·카페 활용']],
            href:'https://www.feel-kobe.jp/en/attractions/detail_1040.html', label:'VISIT KOBE · 난킨마치'
          },
          {
            tag:'늦은 오후 · 야경', name:'메리켄파크 · 하버랜드',
            desc:'고베다운 항구 풍경을 한 번에 보는 구간. 오후 늦게 BE KOBE와 포트타워를 보고, 하버랜드 MOSAIC에서 쇼핑·저녁·야경까지 이어가면 폭염 노출을 줄일 수 있습니다.',
            facts:[['핵심','BE KOBE · 포트타워 · MOSAIC'],['귀환','19시대 신고베 출발 권장']],
            href:'https://www.feel-kobe.jp/en/attractions/detail_1006.html', label:'VISIT KOBE · 메리켄파크'
          }
        ];
        cards.slice(0,3).forEach((card,i) => {
          const d = cardData[i];
          card.innerHTML = `<span>${d.tag}</span><h4>${d.name}</h4><p>${d.desc}</p><dl>${d.facts.map(f=>`<div><dt>${f[0]}</dt><dd>${f[1]}</dd></div>`).join('')}</dl><a href="${d.href}" target="_blank" rel="noopener noreferrer">${d.label} ↗</a>`;
        });

        const caution = day.querySelector('.day3-caution');
        if (caution) {
          caution.innerHTML = `
            <h4>고베 당일치기 · 꼭 확인</h4>
            <ul>
              <li><b>세토대교·산요 신칸센 운행</b> 다카마쓰↔오카야마는 세토대교를 건너므로 강풍·태풍 시 지연·운휴할 수 있습니다. 출발 전 JR 시코쿠·JR-WEST 공지를 확인하세요.</li>
              <li><b>간사이 와이드 패스 ¥12,000</b> 5일권으로 다카마쓰~오카야마 JR 구간과 오카야마~신고베 산요 신칸센 지정석을 이용할 수 있습니다. 지정석은 사전 예약이 안전합니다.</li>
              <li><b>고베 시내 교통은 별도</b> City Loop·시영지하철 등은 패스 밖이므로 소액 교통비를 별도로 잡습니다. 폭염이면 도보를 줄이고 적극적으로 이용하세요.</li>
            </ul>
            <div class="tag-row"><span>신칸센</span><span>실내 피난 쉬움</span><span>쇼핑</span><span>먹거리</span><span>항구 야경</span><span>세토대교 강풍 주의</span></div>
            <div class="source-row">
              <a href="https://www.westjr.co.jp/travel-information/kr/tickets-passes/jrwest-rail-pass/kansai_wide/" target="_blank" rel="noopener noreferrer">JR-WEST 간사이 와이드 패스 ↗</a>
              <a href="https://www.feel-kobe.jp/en/" target="_blank" rel="noopener noreferrer">VISIT KOBE 공식 ↗</a>
              <a href="https://www.jr-shikoku.co.jp/" target="_blank" rel="noopener noreferrer">JR 시코쿠 운행 정보 ↗</a>
            </div>`;
        }
      }

      // Day 3 route card
      const routeCards = [...doc.querySelectorAll('.route-card')];
      const route = routeCards.find(c => c.querySelector('.route-top span')?.textContent.includes('DAY 3'));
      if (route) {
        text(route.querySelector('.route-top h3'), '고베 당일치기');
        const meta = route.querySelectorAll('.route-meta p');
        if (meta[0]) meta[0].innerHTML = '<span>교통수단</span>JR 마린라이너 + 산요 신칸센 + 도보/시내교통';
        if (meta[1]) meta[1].innerHTML = '<span>예상 이동</span>편도 약 1시간 40~55분';
        if (meta[2]) meta[2].innerHTML = '<span>환승</span>오카야마역 1회 (왕복)';
        const stops = ['다카마쓰역','오카야마 환승','신고베역','기타노','산노미야','난킨마치·모토마치','메리켄파크','하버랜드'];
        html(route.querySelector('.route-stops'), stops.map(s=>`<li>${s}</li>`).join(''));
        const links = route.querySelector('.route-links');
        if (links) links.innerHTML = '<a href="https://www.google.com/maps/dir/?api=1&origin=Takamatsu+Station&destination=Shin-Kobe+Station&waypoints=Okayama+Station%7CKitano+Ijinkan+Kobe%7CNankinmachi+Kobe%7CMeriken+Park+Kobe%7CKobe+Harborland&travelmode=transit" target="_blank" rel="noopener noreferrer">고베 당일치기 길찾기 (transit) ↗</a>';
      }

      // Food: replace Kurashiki-only cold noodles card with a Kobe option
      const foodCards = [...doc.querySelectorAll('.food-card')];
      const somen = foodCards.find(c => c.textContent.includes('냉소면·여름 면요리'));
      if (somen) {
        const h = somen.querySelector('h3'); if (h) h.textContent = '고베규 · 스테이크/철판';
        const jp = somen.querySelector('.food-photo span'); if (jp) jp.textContent = '神戸牛';
        const img = somen.querySelector('img'); if (img) { img.src = '/takamatsu-summer-2026/food-beef.jpg'; img.alt = '구운 소고기 스테이크'; }
        const a = somen.querySelector('a'); if (a) { a.href = 'https://www.google.com/maps/search/?api=1&query=Kobe+Beef+Sannomiya'; a.setAttribute('aria-label','고베규 식당을 구글 지도에서 찾기'); }
        replaceText(somen, 'DAY 3 점심 · 구라시키', 'DAY 3 점심/저녁 · 고베');
        replaceText(somen, '가늘고 탄력 있는 면을 차가운 쯔유에 찍어 먹는 여름 별미입니다. 폭염 속 미관지구 야외 산책 뒤 시원하게 한 그릇 즐기기 좋아요.', '고베 대표 먹거리. 예산을 아끼면 런치 세트나 철판구이 소량 메뉴를, 제대로 먹고 싶으면 저녁 하버랜드 전후로 예약 가능한 매장을 선택하세요.');
        replaceText(somen, '미관지구 인근 식당 · 정기휴무·웨이팅 확인', '산노미야·모토마치 중심 · 예약/런치 세트 확인');
        replaceText(somen, '약 ¥700–1,200', '약 ¥2,500~ (메뉴별 차이 큼)');
      }
      replaceText(doc.body, '<b>셋째 날</b> 구라시키 점심(냉소면 등)', '<b>셋째 날</b> 난킨마치 점심 + 고베규 선택');
      // React rendered text nodes do not contain markup above, so handle visible phrase too.
      replaceText(doc.body, '구라시키 점심(냉소면 등)', '난킨마치 점심 + 고베규 선택');

      // Budget
      const total = doc.querySelector('.budget-total');
      if (total) {
        text(total.querySelector('strong'), '₩882,500');
        text(total.querySelector('small'), '1인 확정 37.25만 원 + 현지 예상 51만 원');
        const bar = total.querySelector('.budget-bar'); if (bar) bar.setAttribute('aria-label','확정 비용 42.2%, 예상 비용 57.8%');
        const legend = total.querySelector('.budget-legend'); if (legend) legend.innerHTML = '<span>● 확정 비용 42.2%</span><span>● 현지 예상 57.8%</span>';
      }
      const budgetRows = [...doc.querySelectorAll('.budget-list > div')];
      const transport = budgetRows.find(r => r.textContent.includes('현지 교통'));
      if (transport) { text(transport.querySelector('small'),'간사이 와이드 패스 + 고베 시내교통'); text(transport.querySelector('b'),'₩120,000'); }
      const entry = budgetRows.find(r => r.textContent.includes('입장·체험'));
      if (entry) text(entry.querySelector('small'),'부채 체험·고베 유료 전망/시설 선택 등');
      const budgetNote = doc.querySelector('.budget-note p');
      if (budgetNote) budgetNote.innerHTML = '공항 리무진 왕복과 리쓰린 공원 입장은 쿠폰으로 절약하는 전제예요. 3일차는 <b>간사이 와이드 패스 5일권 ¥12,000</b>을 이용해 다카마쓰↔오카야마 JR과 오카야마↔신고베 산요 신칸센을 묶습니다. 고베 City Loop·시영지하철 등 시내교통은 별도이며, 페리 쿠폰은 사용하지 않습니다.';

      // Plan B / notes
      const planHead = doc.querySelector('.planb-head > p');
      if (planHead) planHead.innerHTML = '3일차 고베도 다카마쓰↔오카야마에서 세토대교를 건너기 때문에 강풍·태풍에는 취약합니다. 아래는 정상 날씨의 확정안과 별개로, <b>쿠폰·패스보다 안전과 귀국편을 우선</b>하는 대비책이에요. 8월은 태풍 시즌이라 매일 아침 상황을 확인하세요.';
      replaceText(doc.body, '세토대교 구간이 불안하면 구라시키를 포기하고', '세토대교 구간이 불안하면 고베를 포기하고');
      const planNote = doc.querySelector('.planb-note p');
      if (planNote) planNote.textContent = '고베는 가되 실내 비중을 늘립니다 — 기타노는 짧게, 12~15시는 산노미야·모토마치 상점가와 백화점·카페를 길게 잡고, 메리켄파크는 해가 기운 뒤 이동하세요.';

      const noteCards = [...doc.querySelectorAll('.note-grid > div')];
      const trainNote = noteCards.find(n => n.textContent.includes('열차는 시간표대로'));
      if (trainNote) {
        const p=trainNote.querySelector('p'); if(p) p.textContent='고베행도 다카마쓰↔오카야마에서 세토대교를 건너고 이후 산요 신칸센으로 이어집니다. 강풍·태풍 시 JR 시코쿠와 JR-WEST 양쪽 운행 정보를 확인하세요.';
      }
      const indoorNote = noteCards.find(n => n.textContent.includes('실내·카페를 안전망으로'));
      if (indoorNote) {
        const p=indoorNote.querySelector('p'); if(p) p.textContent='폭염이면 기타노 야외 시간을 줄이고 산노미야·모토마치·하버랜드의 상점가·백화점·카페를 적극 활용하세요.';
      }

      // Packing wording
      const packing = [...doc.querySelectorAll('.packing-card')].find(c => c.textContent.includes('의류(여름)'));
      if (packing) replaceText(packing, '많이 걷는 날용 편한 신발(리쓰린·구라시키)', '많이 걷는 날용 편한 신발(리쓰린·고베)');

      // Credits: swap three Kurashiki photo credits to Kobe sources
      const credits = [...doc.querySelectorAll('.credits-section li')];
      const replacements = [
        ['구라시키 미관지구', '기타노 거리 — 663highland · CC BY / CC BY-SA 계열'],
        ['오하라미술관', '난킨마치 — Tokumeigakarinoaoshima · CC BY-SA 4.0'],
        ['아이비 스퀘어', '메리켄파크 — Tomomarusan · CC BY 2.5']
      ];
      for (const [needle, value] of replacements) {
        const li = credits.find(x => x.textContent.includes(needle)); if (li) li.textContent = value;
      }

      // Catch remaining obvious Kurashiki labels without touching external consulate wording.
      replaceText(doc.body, '3일차 구라시키는 철도로 다녀와 페리 쿠폰은 사용하지 않습니다.', '3일차 고베는 철도로 다녀오며 페리 쿠폰은 사용하지 않습니다.');
      replaceText(doc.body, '구라시키행 마린라이너·특급', '고베행 마린라이너·산요 신칸센');
      replaceText(doc.body, '구라시키 오하라미술관·상점·카페 등 실내 비중을 늘리고, 미관지구 야외 시간은 줄이세요.', '고베 산노미야·모토마치·하버랜드의 상점·카페 비중을 늘리고, 기타노·메리켄파크 야외 시간은 줄이세요.');

      loading.style.display = 'none';
    }

    frame.addEventListener('load', () => {
      setTimeout(applyKobeVariant, 250);
      setTimeout(applyKobeVariant, 1200);
    });
  })();
  </script>
